<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Stock — C1BLOCK X JEDI</title>
<link rel="stylesheet" href="/style.css">
<style>
body{background:#080808;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:40px auto;padding:20px}.card{background:#151515;border:1px solid #333;border-radius:14px;padding:24px;margin-top:18px}h1{margin-bottom:6px}.muted{color:#aaa}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}label{font-size:12px;color:#aaa}input{width:100%;box-sizing:border-box;padding:12px;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:8px;margin-top:5px}button{margin-top:18px;padding:13px 18px;border:0;border-radius:8px;background:#fff;color:#000;font-weight:700;cursor:pointer}.msg{margin-top:14px;color:#ddd}.status{font-size:12px;margin-top:8px;color:#8f8}h2{margin-top:0}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>STOCK — C1BLOCK X JEDI</h1>
<p class="muted">Pannello privato. La quantità esatta non viene mai mostrata ai clienti.</p>

<div id="login" class="card">
  <label>Password ADMIN</label>
  <input id="password" type="password" autocomplete="current-password">
  <button onclick="login()">ACCEDI</button>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <h2>MAGAZZINO MAGLIE</h2>
    <p class="muted">Lo stock è condiviso tra la versione 30€ e la versione 50€. La firma Jedi non crea una seconda maglia.</p>
    <div class="grid">
      <div><label>S</label><input id="S" type="number" min="0" max="9999"></div>
      <div><label>M</label><input id="M" type="number" min="0" max="9999"></div>
      <div><label>L</label><input id="L" type="number" min="0" max="9999"></div>
      <div><label>XL</label><input id="XL" type="number" min="0" max="9999"></div>
      <div><label>XXL</label><input id="XXL" type="number" min="0" max="9999"></div>
    </div>
    <button onclick="save()">SALVA STOCK</button>
    <div id="msg" class="msg"></div>
    <div id="status" class="status"></div>
  </div>
</div>
</div>

<script>
let password="";
const sizes=["S","M","L","XL","XXL"];
async function api(payload){
  const r=await fetch('/api/stock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json().catch(()=>({error:'Risposta non valida'}));
  if(!r.ok) throw new Error(d.error||'Errore');
  return d;
}
async function login(){
  password=document.getElementById('password').value;
  try{
    const d=await api({action:'get',password});
    for(const s of sizes) document.getElementById(s).value=d[s];
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    document.getElementById('msg').textContent='Stock caricato.';
    document.getElementById('status').textContent='Stock condiviso tra 30€ e 50€.';
  }catch(e){document.getElementById('loginMsg').textContent=e.message;}
}
async function save(){
  const stock={};
  for(const s of sizes) stock[s]=document.getElementById(s).value;
  try{
    await api({action:'set',password,stock});
    document.getElementById('msg').textContent='✓ Stock aggiornato.';
  }catch(e){document.getElementById('msg').textContent=e.message;}
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
