<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Gestione Stock - C1BLOCK X JEDI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .wrap {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
    }

    h2 {
      margin-top: 0;
    }

    .muted {
      color: #999;
    }

    .card {
      background: #151515;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      background: #0d0d0d;
      color: white;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px 20px;
      border: 0;
      border-radius: 8px;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff6b6b;
      margin-top: 15px;
      font-weight: bold;
    }

    .success {
      color: #7cff9b;
      margin-top: 15px;
      font-weight: bold;
    }

    .info {
      color: #aaa;
      margin-top: 15px;
    }

    .stock-zero {
      border-color: #ff6b6b;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>STOCK - C1BLOCK X JEDI</h1>

  <p class="muted">
    Pannello privato. I clienti non vedono le quantità.
  </p>


  <!-- =========================
       LOGIN
  ========================== -->

  <div id="loginBox" class="card">

    <h2>Password ADMIN</h2>

    <input
      id="password"
      type="password"
      placeholder="Inserisci password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      ACCEDI
    </button>

    <div id="loginMessage"></div>

  </div>


  <!-- =========================
       PANNELLO STOCK
  ========================== -->

  <div id="panel" class="hidden">

    <!-- =========================
         MAGLIA 30€
    ========================== -->

    <div class="card">

      <h2>MAGLIA - 30€</h2>

      <div class="grid">

        <div>
          <label>S</label>
          <input
            id="30-S"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

        <div>
          <label>M</label>
          <input
            id="30-M"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

        <div>
          <label>L</label>
          <input
            id="30-L"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

        <div>
          <label>XL</label>
          <input
            id="30-XL"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

        <div>
          <label>XXL</label>
          <input
            id="30-XXL"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

      </div>

    </div>


    <!-- =========================
         MAGLIA 50€
    ========================== -->

    <div class="card">

      <h2>MAGLIA CON FIRMA JEDI - 50€</h2>

      <div class="grid">

        <div>
          <label>S</label>
          <input
            id="50-S"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

        <div>
          <label>M</label>
          <input
            id="50-M"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

        <div>
          <label>L</label>
          <input
            id="50-L"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

        <div>
          <label>XL</label>
          <input
            id="50-XL"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

        <div>
          <label>XXL</label>
          <input
            id="50-XXL"
            type="number"
            min="0"
            max="10000"
            step="1"
          >
        </div>

      </div>

      <button id="saveButton">
        SALVA STOCK
      </button>

      <div id="message"></div>

    </div>

  </div>

</div>


<script>

const RAILWAY_URL =
  "https://c1block-x-jedi-production-83ad.up.railway.app";


const ADMIN_STOCK_URL =
  `${RAILWAY_URL}/api/admin/stock`;


const versions = [
  "30",
  "50"
];


const sizes = [
  "S",
  "M",
  "L",
  "XL",
  "XXL"
];


let adminPassword = "";


/* =========================
   STOCK VUOTO
========================= */

function emptyStock() {

  return {

    "30": {
      S: 0,
      M: 0,
      L: 0,
      XL: 0,
      XXL: 0
    },

    "50": {
      S: 0,
      M: 0,
      L: 0,
      XL: 0,
      XXL: 0
    }

  };

}


/* =========================
   NORMALIZZA STOCK
========================= */

function normalizeStock(data) {

  const stock =
    emptyStock();


  if (
    !data ||
    typeof data !== "object"
  ) {

    return stock;

  }


  const source =
    data.stock &&
    typeof data.stock === "object"
      ? data.stock
      : data;


  for (
    const version of versions
  ) {

    if (
      !source[version] ||
      typeof source[version] !== "object"
    ) {

      continue;

    }


    for (
      const size of sizes
    ) {

      const value =
        Number(
          source[version][size]
        );


      if (
        Number.isFinite(value) &&
        Number.isInteger(value) &&
        value >= 0 &&
        value <= 10000
      ) {

        stock[version][size] =
          value;

      }

    }

  }


  return stock;

}


/* =========================
   MOSTRA STOCK
========================= */

function showStock(stock) {

  for (
    const version of versions
  ) {

    for (
      const size of sizes
    ) {

      const input =
        document.getElementById(
          `${version}-${size}`
        );


      if (!input) {
        continue;
      }


      input.value =
        stock[version][size];


      updateInputStyle(input);

    }

  }

}


/* =========================
   COLORE INPUT A ZERO
========================= */

function updateInputStyle(input) {

  const value =
    Number(input.value);


  if (
    Number.isInteger(value) &&
    value === 0
  ) {

    input.classList.add(
      "stock-zero"
    );

  } else {

    input.classList.remove(
      "stock-zero"
    );

  }

}


/* =========================
   LOGIN
========================= */

async function login() {

  const passwordInput =
    document.getElementById(
      "password"
    );


  const loginMessage =
    document.getElementById(
      "loginMessage"
    );


  const password =
    passwordInput.value.trim();


  if (!password) {

    loginMessage.textContent =
      "Inserisci la password.";

    loginMessage.className =
      "error";

    return;

  }


  loginMessage.textContent =
    "Accesso...";

  loginMessage.className =
    "info";


  try {

    const response =
      await fetch(
        ADMIN_STOCK_URL,
        {
          method: "GET",

          cache: "no-store",

          headers: {
            "x-admin-key":
              password,

            "Cache-Control":
              "no-cache"
          }
        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    if (!response.ok) {

      throw new Error(
        data.error ||
        `Errore HTTP ${response.status}`
      );

    }


    adminPassword =
      password;


    const stock =
      normalizeStock(data);


    showStock(stock);


    document
      .getElementById(
        "loginBox"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "panel"
      )
      .classList.remove(
        "hidden"
      );


    loginMessage.textContent =
      "";

  } catch (error) {

    console.error(
      "Errore login:",
      error
    );


    loginMessage.textContent =
      error.message ||
      "Errore durante l'accesso.";


    loginMessage.className =
      "error";

  }

}


/* =========================
   LEGGI STOCK DALLA PAGINA
========================= */

function getStockFromPage() {

  const stock =
    emptyStock();


  for (
    const version of versions
  ) {

    for (
      const size of sizes
    ) {

      const input =
        document.getElementById(
          `${version}-${size}`
        );


      if (!input) {
        continue;
      }


      const value =
        Number(
          input.value
        );


      if (
        !Number.isInteger(value) ||
        value < 0 ||
        value > 10000
      ) {

        throw new Error(
          `Valore non valido: ${version}-${size}`
        );

      }


      stock[version][size] =
        value;

    }

  }


  return stock;

}


/* =========================
   SALVA STOCK
========================= */

async function saveStock() {

  const message =
    document.getElementById(
      "message"
    );


  const saveButton =
    document.getElementById(
      "saveButton"
    );


  let stock;


  try {

    stock =
      getStockFromPage();

  } catch (error) {

    message.textContent =
      error.message;

    message.className =
      "error";

    return;

  }


  message.textContent =
    "Salvataggio...";

  message.className =
    "info";


  saveButton.disabled =
    true;


  try {

    const response =
      await fetch(
        ADMIN_STOCK_URL,
        {
          method: "PUT",

          cache: "no-store",

          headers: {

            "Content-Type":
              "application/json",

            "x-admin-key":
              adminPassword,

            "Cache-Control":
              "no-cache"

          },

          body:
            JSON.stringify({
              stock: stock
            })

        }
      );


    const data =
      await response
        .json()
        .catch(
          () => ({})
        );


    if (!response.ok) {

      throw new Error(
        data.error ||
        `Errore HTTP ${response.status}`
      );

    }


    const savedStock =
      normalizeStock(data);


    showStock(
      savedStock
    );


    message.textContent =
      "✓ Stock aggiornato correttamente.";

    message.className =
      "success";


  } catch (error) {

    console.error(
      "Errore salvataggio:",
      error
    );


    message.textContent =
      error.message ||
      "Errore durante il salvataggio.";

    message.className =
      "error";


  } finally {

    saveButton.disabled =
      false;

  }

}


/* =========================
   EVENTI
========================= */

document
  .getElementById(
    "loginButton"
  )
  .addEventListener(
    "click",
    login
  );


document
  .getElementById(
    "saveButton"
  )
  .addEventListener(
    "click",
    saveStock
  );


document
  .getElementById(
    "password"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        login();

      }

    }
  );


for (
  const version of versions
) {

  for (
    const size of sizes
  ) {

    const input =
      document.getElementById(
        `${version}-${size}`
      );


    if (input) {

      input.addEventListener(
        "input",
        function() {

          updateInputStyle(
            this
          );

        }
      );

    }

  }

}

</script>

</body>
</html>
