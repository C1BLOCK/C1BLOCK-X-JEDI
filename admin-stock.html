<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock — C1BLOCK X JEDI</title>
<link rel="stylesheet" href="/style.css">
<style>
body{background:#080808;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:40px auto;padding:20px}
.card{background:#151515;border:1px solid #333;border-radius:14px;padding:24px;margin-top:18px}
h1{margin-bottom:6px}.muted{color:#aaa}.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
label{font-size:12px;color:#aaa}input{width:100%;box-sizing:border-box;padding:12px;background:#0d0d0d;color:#fff;border:1px solid #444;border-radius:8px;margin-top:5px}
button{margin-top:18px;padding:13px 18px;border:0;border-radius:8px;background:#fff;color:#000;font-weight:700;cursor:pointer}
.msg{margin-top:14px;color:#ddd}
h2{margin-top:0}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<h1>STOCK — C1BLOCK X JEDI</h1>
<p class="muted">Pannello privato. I clienti non vedono le quantità.</p>

<div id="login" class="card">
  <label>Password ADMIN</label>
  <input id="password" type="password" autocomplete="current-password">
  <button onclick="login()">ACCEDI</button>
  <div id="loginMsg" class="msg"></div>
</div>

<div id="panel" class="hidden">
  <div class="card">
    <h2>MAGLIA — 30€</h2>
    <div class="grid">
      <div><label>S</label><input id="30-S" type="number" min="0" max="9999"></div>
      <div><label>M</label><input id="30-M" type="number" min="0" max="9999"></div>
      <div><label>L</label><input id="30-L" type="number" min="0" max="9999"></div>
      <div><label>XL</label><input id="30-XL" type="number" min="0" max="9999"></div>
      <div><label>XXL</label><input id="30-XXL" type="number" min="0" max="9999"></div>
    </div>
  </div>

  <div class="card">
    <h2>MAGLIA CON FIRMA JEDI — 50€</h2>
    <div class="grid">
      <div><label>S</label><input id="50-S" type="number" min="0" max="9999"></div>
      <div><label>M</label><input id="50-M" type="number" min="0" max="9999"></div>
      <div><label>L</label><input id="50-L" type="number" min="0" max="9999"></div>
      <div><label>XL</label><input id="50-XL" type="number" min="0" max="9999"></div>
      <div><label>XXL</label><input id="50-XXL" type="number" min="0" max="9999"></div>
    </div>
    <button onclick="save()">SALVA STOCK</button>
    <div id="msg" class="msg"></div>
  </div>
</div>
</div>

<script>
let password="";
const sizes=["S","M","L","XL","XXL"];

async function api(payload){
  const r=await fetch('/.netlify/functions/stock',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload)
  });
  const d=await r.json();
  if(!r.ok) throw new Error(d.error||'Errore');
  return d;
}

async function login(){
  password=document.getElementById('password').value;
  try{
    const d=await api({action:'get',password});
    for(const v of ['30','50']) for(const s of sizes)
      document.getElementById(v+'-'+s).value=d[v][s];
    document.getElementById('login').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    document.getElementById('msg').textContent='Stock caricato.';
  }catch(e){
    document.getElementById('loginMsg').textContent=e.message;
  }
}

async function save(){
  const stock={"30":{},"50":{}};
  for(const v of ['30','50']) for(const s of sizes)
    stock[v][s]=document.getElementById(v+'-'+s).value;
  try{
    await api({action:'set',password,stock});
    document.getElementById('msg').textContent='✓ Stock aggiornato.';
  }catch(e){
    document.getElementById('msg').textContent=e.message;
  }
}
</script>
</body>
</html>
