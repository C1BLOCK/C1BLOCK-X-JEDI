<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C1BLOCK X JEDI - Gestione Stock</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 30px 16px;
    }
    .wrap { max-width: 900px; margin: auto; }
    h1 { margin-bottom: 8px; }
    .sub { color: #aaa; margin-bottom: 25px; }
    .box {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .login { display: flex; gap: 10px; flex-wrap: wrap; }
    input {
      background: #0d0d0d;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary { background: #fff; color: #000; }
    .save { background: #fff; color: #000; width: 100%; margin-top: 18px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 6px; text-align: center; border-bottom: 1px solid #333; }
    th { color: #aaa; font-size: 14px; }
    td:first-child, th:first-child { text-align: left; }
    td input { width: 75px; text-align: center; }
    #panel { display: none; }
    #message { margin-top: 14px; min-height: 22px; color: #bbb; }
  </style>
</head>
<body>
<div class="wrap">
  <h1>C1BLOCK X JEDI</h1>
  <div class="sub">Gestione stock</div>

  <div class="box" id="loginBox">
    <h2>Accesso amministratore</h2>
    <div class="login">
      <input id="password" type="password" placeholder="Password amministratore">
      <button class="primary" onclick="login()">Accedi</button>
    </div>
    <div id="loginMessage"></div>
  </div>

  <div id="panel">
    <div class="box">
      <h2>Stock magliette</h2>
      <table>
        <thead>
          <tr>
            <th>Versione</th>
            <th>S</th>
            <th>M</th>
            <th>L</th>
            <th>XL</th>
            <th>XXL</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>30€</td>
            <td><input id="30-S" type="number" min="0"></td>
            <td><input id="30-M" type="number" min="0"></td>
            <td><input id="30-L" type="number" min="0"></td>
            <td><input id="30-XL" type="number" min="0"></td>
            <td><input id="30-XXL" type="number" min="0"></td>
          </tr>
          <tr>
            <td>50€ con firma</td>
            <td><input id="50-S" type="number" min="0"></td>
            <td><input id="50-M" type="number" min="0"></td>
            <td><input id="50-L" type="number" min="0"></td>
            <td><input id="50-XL" type="number" min="0"></td>
            <td><input id="50-XXL" type="number" min="0"></td>
          </tr>
        </tbody>
      </table>
      <button class="save" onclick="saveStock()">SALVA STOCK</button>
      <div id="message"></div>
    </div>
  </div>
</div>

<script>
let adminPassword = '';

async function login() {
  const password = document.getElementById('password').value;
  if (!password) return;

  const response = await fetch('/api/admin/stock', {
    headers: { 'x-admin-password': password }
  });

  if (!response.ok) {
    document.getElementById('loginMessage').textContent = 'Password non valida.';
    return;
  }

  adminPassword = password;
  const stock = await response.json();

  for (const version of ['30', '50']) {
    for (const size of ['S', 'M', 'L', 'XL', 'XXL']) {
      document.getElementById(`${version}-${size}`).value =
        Number(stock?.[version]?.[size] || 0);
    }
  }

  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
}

async function saveStock() {
  const stock = { '30': {}, '50': {} };

  for (const version of ['30', '50']) {
    for (const size of ['S', 'M', 'L', 'XL', 'XXL']) {
      stock[version][size] = Math.max(
        0,
        Number.parseInt(document.getElementById(`${version}-${size}`).value, 10) || 0
      );
    }
  }

  const response = await fetch('/api/admin/stock', {
    method: 'PUT',
    headers: {
      'Content-Type': 'application/json',
      'x-admin-password': adminPassword
    },
    body: JSON.stringify(stock)
  });

  const message = document.getElementById('message');

  if (response.ok) {
    message.textContent = 'Stock salvato correttamente.';
  } else {
    message.textContent = 'Errore nel salvataggio.';
  }
}
</script>
</body>
</html>
